name: Frontend CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

env:
  REGISTRY: docker.io 

jobs:
  # temporary even though there is not test files
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
      
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      
      - name: Install dependencies
        run: bun install --frozen-lockfile
      
      - name: Run tests
        run: echo "Thre is no test to run it is dummy."
  
  # build container
  build:
    name: Build and Publish
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      
      - name: Log in to Docker
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: Build and Push Image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          cache-from: type=registry,ref=pdevfig/front-temp:buildcache
          cache-to: type=registry,ref=pdevfig/front-temp:buildcache,mode=max
          tags: |
            pdevfig/front-temp:${{ github.sha }}
            pdevfig/front-temp:main